[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tori-taurus"
version = "0.1.0"
description = "AI-assisted quantitative trading research and risk-management platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.2; platform_system == 'Windows'"]

[project.scripts]
tori-market-check = "tori_taurus.market_data.smoke:main"
tori-report = "tori_taurus.report:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
calendar = ["pandas-market-calendars>=5.5,<6"]

[project.urls]
Repository = "https://github.com/Patrick-Mebust/Tori-Taurus"
Issues = "https://github.com/Patrick-Mebust/Tori-Taurus/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tori_taurus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
